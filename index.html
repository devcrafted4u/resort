<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo/logo-emblem.png" />
    
    <!-- iOS / Safari Viewport with Notch & Dynamic Island Cover Support (Pinch-to-zoom accessible) -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    
    <!-- Primary Meta Tags -->
    <title>Sams Eden Resorts — Escape the Ordinary. Embrace Nature</title>
    <meta name="title" content="Sams Eden Resorts — Escape the Ordinary. Embrace Nature" />
    <meta name="description" content="Discover Sams Eden Resorts. Premier day outing packages, luxury cottages, camping tent stays, dormitory rooms, 14 rope activities, swimming pool, and corporate event spaces surrounded by lush nature." />
    <meta name="keywords" content="Sams Eden Resorts, day outing resort, tent stay, cottage stay, swimming pool, rope activities, zipline, corporate team outing, Bangalore resort getaway" />
    
    <!-- Mobile Theme Color & Status Bar -->
    <meta name="theme-color" content="#173F2B" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Sams Eden" />
    
    <!-- Apple Touch Icons & Web Manifest -->
    <link rel="apple-touch-icon" href="/logo/logo-emblem.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/logo/logo-emblem.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    
    <!-- Disable Automatic Unwanted Telephone Linking (while letting explicit tel: work) -->
    <meta name="format-detection" content="telephone=no" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://samsedenresorts.com/" />
    <meta property="og:title" content="Sams Eden Resorts — Escape the Ordinary. Embrace Nature" />
    <meta property="og:description" content="Experience nature, adventure, and relaxation at Sams Eden Resorts. Discover day outings from ₹850, camping tents, cottages, and corporate retreat facilities." />
    <meta property="og:image" content="/images/pool/resort-pool.webp" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:title" content="Sams Eden Resorts — Escape the Ordinary. Embrace Nature" />
    <meta property="twitter:description" content="Adventure, Nature, Memories. Day outings, overnight stays, 14 rope activities, pool, and celebrations." />
    <meta property="twitter:image" content="/images/pool/resort-pool.webp" />

    <!-- Preload Hero Image for Mobile Safari LCP -->
    <link rel="preload" as="image" href="/images/pool/resort-pool.webp" fetchpriority="high" />

    <!-- Google Fonts: Playfair Display & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-cream font-sans text-stone-800 antialiased selection:bg-gold selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
